[project]
name = "transitpulse-backend"
version = "0.1.0"
description = "TransitPulse API and background-service foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.116,<1",
    "gtfs-realtime-bindings>=1.0,<2",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.10,<3",
    "redis>=6,<7",
    "sqlalchemy[asyncio]>=2.0,<3",
    "structlog>=25,<26",
    "tzdata>=2025.2,<2027",
    "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
transitpulse-api = "transitpulse.commands:run_api"
transitpulse-migrate = "transitpulse.commands:run_migrations"
transitpulse-worker = "transitpulse.commands:run_worker"
transitpulse-import-gtfs = "transitpulse.commands:run_static_import"

[dependency-groups]
dev = [
    "pyright>=1.1.403,<2",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.1,<2",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/transitpulse"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = [
    "integration: requires PostgreSQL and Valkey",
]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
